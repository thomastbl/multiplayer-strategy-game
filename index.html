<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wargame</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="./main.js" type="module"></script>
  </head>

  <body>
    <div class="menu-card" data-view="menu">
      <button data-go="login">Se connecter</button>
      <button data-go="signup">S'inscrire</button>
    </div>
    <div class="menu-card" data-view="login" hidden>
      <button data-go="menu" class="back-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <form action="http://localhost:8080/" method="post">
        <label for="username_lg">Nom d'utilisateur</label>
        <input type="text" name="username" id="username_lg" />
        <label for="password_lg">Mot de passe</label>
        <input type="password" name="password" id="password_lg" />
        <button type="button" id="login-button">Se connecter</button>
      </form>
    </div>
    <div class="menu-card" data-view="signup" hidden>
      <button data-go="menu" class="back-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <form action="http://localhost:8080/" method="post">
        <label for="username_su">Nom d'utilisateur</label>
        <input type="text" name="username" id="username_su" />
        <label for="password_su">Mot de passe</label>
        <input type="password" name="password" id="password_su" />
        <button type="button" id="signup-button">S'inscrire</button>
      </form>
    </div>
  </body>
</html>
