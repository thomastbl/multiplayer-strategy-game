<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wargame</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="./style/style.css" />
    <script src="./client/main.js" type="module"></script>
  </head>

  <body>
    <div class="menu-card" data-view="menu">
      <button data-go="login">Log in</button>
      <button data-go="signup">Sign-up</button>
      <button data-go="gameMenu" id="enter-game-button" hidden>
        Enter in game
      </button>
    </div>
    <div class="menu-card" data-view="login" hidden>
      <button data-go="menu" class="back-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <form action="http://localhost:8080/" method="post">
        <label for="username_lg">Username</label>
        <input type="text" name="username" id="username_lg" />
        <label for="password_lg">Password</label>
        <input type="password" name="password" id="password_lg" />
        <button type="button" id="login-button">Log in</button>
        <p class="" id="login-status"></p>
      </form>
    </div>
    <div class="menu-card" data-view="signup" hidden>
      <button data-go="menu" class="back-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <form action="http://localhost:8080/" method="post">
        <label for="username_su">Username</label>
        <input type="text" name="username" id="username_su" />
        <label for="password_su">Password</label>
        <input type="password" name="password" id="password_su" />
        <button type="button" id="signup-button">Sign-up</button>
        <p class="" id="signup-status"></p>
      </form>
    </div>
    <div class="gameMenu" data-view="gameMenu" hidden>
      <div class="header">
        <div class="header-left">
          <div>
            <div class="padding">
              <button data-go="menu" class="back-button" id="menu-game-back">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="19" y1="12" x2="5" y2="12" />
                  <polyline points="12 19 5 12 12 5" />
                </svg>
              </button>
            </div>
          </div>
          <div class="right-side-header-left">
            <div class="padding">PLAY</div>
            <div class="padding">MESSAGES</div>
          </div>
        </div>

        <div class="logo">
          <img src="./assets/img/tears_of_regret_b_t.svg" alt="game_logo" />
        </div>

        <div class="header-right">
          <div class="padding left-side-header-right">PROFILE</div>
          <div class="padding">
            <button data-go="menu" class="back-button" id="logout">
              Log Out
            </button>
          </div>
        </div>
      </div>
      <div class="main-menu">
        <div class="left-side">
          <div class="player-card padding">PLAYER CARD</div>
          <div class="friends-card padding">FRIENDS LIST</div>
        </div>
        <div class="middle-side">
          <div class="lobby-card">
            <table>
              <caption>
                Lobbies
              </caption>
              <thead>
                <tr>
                  <th scope="col">Lobby's name</th>
                  <th scope="col">Host</th>
                  <th scope="col">Map</th>
                  <th scope="col">Number of players</th>
                  <th scope="col">Game status</th>
                </tr>
              </thead>
            </table>
          </div>
        </div>
        <div class="right-side">
          <div class="connected-players padding">Connected players</div>
        </div>
      </div>
    </div>
  </body>
</html>
