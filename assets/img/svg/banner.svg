<svg width="100%" viewBox="0 0 1920 400" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid meet"><title>Military UI banner</title><desc>Rotating wireframe globe grid with curved unit advances and a contested front line.</desc>
<defs>
<clipPath id="globe"><circle cx="420" cy="200" r="150"/></clipPath>
<clipPath id="panel"><rect x="700" y="40" width="1180" height="320"/></clipPath>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d4a3f" stroke-width="0.5" opacity="0.6"/></pattern>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker>
<style>
text{font-family:ui-monospace,Menlo,monospace;letter-spacing:1px}
.hud{fill:#5DCAA5;font-size:12px}
.dim{fill:#2f6d5c;font-size:11px}
.hot{fill:#EF9F27;font-size:12px}
.red{fill:#E24B4A;font-size:12px}
@keyframes spin{to{transform:translateX(-360px)}}
@keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes clash{0%,40%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.15)}62%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(.4)}}
@keyframes push{0%,35%{transform:translateX(0)}55%{transform:translateX(26px)}80%{transform:translateX(-10px)}100%{transform:translateX(0)}}
@keyframes dashflow{to{stroke-dashoffset:-60}}
@keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateX(1180px);opacity:0}}
@keyframes ride{0%{offset-distance:0%}42%{offset-distance:100%}58%{offset-distance:100%}100%{offset-distance:0%}}
@keyframes reveal{0%{stroke-dashoffset:600}42%,58%{stroke-dashoffset:0}100%{stroke-dashoffset:600}}
.map-spin{animation:spin 9s linear infinite}
.sweep{animation:sweep 9s linear infinite;transform-origin:420px 200px}
.b{animation:blink 3s ease-in-out infinite}
.clash{animation:clash 9s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.front{animation:push 9s ease-in-out infinite}
.flow{stroke-dasharray:8 6;animation:dashflow 3s linear infinite}
.scan{animation:scan 9s linear infinite}
.unit{animation:ride 9s cubic-bezier(.5,.02,.45,1) infinite;offset-rotate:0deg}
.axis{stroke-dasharray:600;animation:reveal 9s cubic-bezier(.5,.02,.45,1) infinite}
</style>
</defs>

<rect x="0" y="0" width="1920" height="400" fill="#05100d"/>
<rect x="0" y="0" width="1920" height="400" fill="url(#grid)" opacity="0.5"/>

<g clip-path="url(#globe)">
<circle cx="420" cy="200" r="150" fill="#08211b"/>
<g class="map-spin">
<g stroke="#1d9e75" stroke-width="0.6" opacity="0.75" fill="none">
<path d="M0 90H900M0 140H900M0 200H900M0 260H900M0 310H900"/>
</g>
<g stroke="#1d9e75" stroke-width="0.6" opacity="0.5" fill="none">
<path d="M60 40V360M150 40V360M240 40V360M330 40V360M420 40V360M510 40V360M600 40V360M690 40V360M780 40V360"/>
</g>
</g>
<g fill="#EF9F27"><circle cx="360" cy="170" r="3" class="b"/><circle cx="470" cy="230" r="3" class="b" style="animation-delay:1s"/><circle cx="430" cy="140" r="3" class="b" style="animation-delay:2s"/></g>
<g class="sweep"><path d="M420 200 L420 50 A150 150 0 0 1 545 125 Z" fill="#5DCAA5" opacity="0.10"/><line x1="420" y1="200" x2="420" y2="50" stroke="#5DCAA5" stroke-width="1" opacity=".5"/></g>
</g>
<circle cx="420" cy="200" r="150" fill="none" stroke="#1d9e75" stroke-width="1" opacity=".7"/>
<circle cx="420" cy="200" r="164" fill="none" stroke="#1d9e75" stroke-width="0.5" stroke-dasharray="3 9" opacity=".6"/>
<circle cx="420" cy="200" r="176" fill="none" stroke="#1d9e75" stroke-width="0.5" opacity=".25"/>
<text class="dim" x="270" y="42">GEO // ORBITAL FEED 04</text>
<text class="hud" x="270" y="378">LAT 43.29  LON 05.37  ·  SYNC OK</text>

<line x1="640" y1="40" x2="640" y2="360" stroke="#1d9e75" stroke-width="0.5" opacity=".5"/>
<text class="dim" x="60" y="60">◤ THEATRE COMMAND</text>
<text class="hud" x="60" y="90">STATUS</text><text class="hot" x="150" y="90">ENGAGED</text>
<text class="hud" x="60" y="115">SECTOR</text><text class="dim" x="150" y="115">NE-14</text>
<text class="hud" x="60" y="140">UNITS</text><text class="dim" x="150" y="140">148 / 160</text>
<rect x="60" y="155" width="160" height="6" fill="none" stroke="#1d9e75" stroke-width="0.5"/>
<rect x="61" y="156" width="148" height="4" fill="#1d9e75" opacity=".8"/>
<text class="red" x="60" y="195">▲ CONTACT IMMINENT</text>
<g stroke="#1d9e75" stroke-width="0.5" opacity=".4"><path d="M40 40h40M40 40v40M40 360h40M40 360v-40"/></g>

<g clip-path="url(#panel)">
<rect x="700" y="40" width="1180" height="320" fill="#061a15"/>
<g stroke="#12463a" stroke-width="0.5" opacity=".8">
<path d="M700 90H1880M700 140H1880M700 190H1880M700 240H1880M700 290H1880M700 340H1880"/>
<path d="M760 40V360M820 40V360M880 40V360M940 40V360M1000 40V360M1060 40V360M1120 40V360M1180 40V360M1240 40V360M1300 40V360M1360 40V360M1420 40V360M1480 40V360M1540 40V360M1600 40V360M1660 40V360M1720 40V360M1780 40V360M1840 40V360"/>
</g>
<path d="M760 320q120-40 210-30t180-70 200 20 240-60 250 10" fill="none" stroke="#2f6d5c" stroke-width="1.5" opacity=".7"/>
<path d="M760 110q140 30 240-10t220 40 210-30 260 40" fill="none" stroke="#2f6d5c" stroke-width="1.5" opacity=".7"/>
<rect x="700" y="40" width="60" height="320" fill="#5DCAA5" opacity="0.06" class="scan"/>

<g class="front">
<path d="M1290 45 L1275 110 L1300 175 L1272 240 L1295 305 L1280 358" fill="none" stroke="#EF9F27" stroke-width="2" opacity=".9"/>
<path d="M1290 45 L1275 110 L1300 175 L1272 240 L1295 305 L1280 358" fill="none" stroke="#EF9F27" stroke-width="14" opacity=".12"/>
</g>

<path class="axis flow" d="M880 120 C 970 60, 1070 200, 1150 130 S 1220 90, 1245 118" fill="none" stroke="#85B7EB" stroke-width="1.5" opacity=".75" marker-end="url(#ah)"/>
<g class="unit" style="offset-path:path('M880 120 C 970 60, 1070 200, 1150 130 S 1220 90, 1245 118')"><rect x="-24" y="-14" width="48" height="28" fill="#0c447c" stroke="#85B7EB" stroke-width="1"/><path d="M-24-14 24 14M24-14-24 14" stroke="#85B7EB" stroke-width="1"/><text class="hud" x="-24" y="-20" style="fill:#85B7EB">1/ARM</text></g>

<path class="axis flow" style="animation-delay:.5s" d="M860 250 C 950 330, 1020 190, 1110 270 S 1200 300, 1235 254" fill="none" stroke="#85B7EB" stroke-width="1.5" opacity=".75" marker-end="url(#ah)"/>
<g class="unit" style="animation-delay:.5s;offset-path:path('M860 250 C 950 330, 1020 190, 1110 270 S 1200 300, 1235 254')"><rect x="-24" y="-14" width="48" height="28" fill="#0c447c" stroke="#85B7EB" stroke-width="1"/><ellipse cx="0" cy="0" rx="9" ry="9" fill="none" stroke="#85B7EB" stroke-width="1"/><text class="hud" x="-24" y="-20" style="fill:#85B7EB">3/MEC</text></g>

<path class="axis flow" style="animation-delay:1s" d="M800 330 C 900 300, 940 210, 1050 205 S 1190 160, 1240 188" fill="none" stroke="#85B7EB" stroke-width="1.5" opacity=".55" marker-end="url(#ah)"/>
<g class="unit" style="animation-delay:1s;offset-path:path('M800 330 C 900 300, 940 210, 1050 205 S 1190 160, 1240 188')"><rect x="-24" y="-14" width="48" height="28" fill="#0c447c" stroke="#85B7EB" stroke-width="1"/><path d="M-24 14 0-14 24 14" fill="none" stroke="#85B7EB" stroke-width="1"/><text class="hud" x="-24" y="-20" style="fill:#85B7EB">7/ART</text></g>

<path class="axis flow" style="animation-delay:.2s" d="M1700 150 C 1600 90, 1520 220, 1430 140 S 1360 100, 1335 152" fill="none" stroke="#F09595" stroke-width="1.5" opacity=".75" marker-end="url(#ah)"/>
<g class="unit" style="animation-delay:.2s;offset-path:path('M1700 150 C 1600 90, 1520 220, 1430 140 S 1360 100, 1335 152')"><rect x="-24" y="-14" width="48" height="28" fill="#791f1f" stroke="#F09595" stroke-width="1"/><path d="M-24-14 24 14M24-14-24 14" stroke="#F09595" stroke-width="1"/><text class="red" x="-24" y="-20">4/PZ</text></g>

<path class="axis flow" style="animation-delay:.8s" d="M1740 290 C 1640 340, 1560 210, 1470 285 S 1380 320, 1345 288" fill="none" stroke="#F09595" stroke-width="1.5" opacity=".75" marker-end="url(#ah)"/>
<g class="unit" style="animation-delay:.8s;offset-path:path('M1740 290 C 1640 340, 1560 210, 1470 285 S 1380 320, 1345 288')"><rect x="-24" y="-14" width="48" height="28" fill="#791f1f" stroke="#F09595" stroke-width="1"/><ellipse cx="0" cy="0" rx="9" ry="9" fill="none" stroke="#F09595" stroke-width="1"/><text class="red" x="-24" y="-20">9/INF</text></g>

<path class="axis flow" style="animation-delay:1.3s" d="M1810 70 C 1700 120, 1640 60, 1540 110 S 1420 200, 1340 196" fill="none" stroke="#F09595" stroke-width="1.5" opacity=".55" marker-end="url(#ah)"/>
<g class="unit" style="animation-delay:1.3s;offset-path:path('M1810 70 C 1700 120, 1640 60, 1540 110 S 1420 200, 1340 196')"><rect x="-24" y="-14" width="48" height="28" fill="#791f1f" stroke="#F09595" stroke-width="1"/><path d="M-24 14 0-14 24 14" fill="none" stroke="#F09595" stroke-width="1"/><text class="red" x="-24" y="-20">2/ART</text></g>

<g class="clash"><circle cx="1288" cy="120" r="20" fill="none" stroke="#EF9F27" stroke-width="2"/><path d="M1268 100 1308 140M1308 100 1268 140" stroke="#EF9F27" stroke-width="2"/></g>
<g class="clash" style="animation-delay:.5s"><circle cx="1282" cy="256" r="20" fill="none" stroke="#EF9F27" stroke-width="2"/><path d="M1262 236 1302 276M1302 236 1262 276" stroke="#EF9F27" stroke-width="2"/></g>
<g class="clash" style="animation-delay:1.1s"><circle cx="1292" cy="190" r="14" fill="none" stroke="#E24B4A" stroke-width="2"/><path d="M1278 176 1306 204M1306 176 1278 204" stroke="#E24B4A" stroke-width="2"/></g>
</g>
<rect x="700" y="40" width="1180" height="320" fill="none" stroke="#1d9e75" stroke-width="1" opacity=".7"/>
<text class="dim" x="712" y="60">TAC-MAP // FRONT NE-14</text>
<text class="hot" x="1700" y="60">◆ ENGAGEMENT</text>
<text class="dim" x="712" y="352">ZOOM 4.2x</text>
<text class="dim" x="1770" y="352">T+ 00:09:00</text>
<g stroke="#5DCAA5" stroke-width="1" opacity=".8"><path d="M700 40h16M700 40v16M1880 40h-16M1880 40v16M700 360h16M700 360v-16M1880 360h-16M1880 360v-16"/></g>
</svg>